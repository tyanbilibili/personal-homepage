        <div class="article-body">
<p>风轻吹叶无情，花盛开蝶不在。</p>
<p>月隐于风云，情藏于哭笑。</p>
<p>嬉笑鸣鸣，芳华萦萦。</p>
<p>败花开，落叶荫。</p>
<p>舞罢，歌停。</p>
<p>离，散。</p>
<p>殇。</p>
<p>①本诗作于诗人与友人分别之时。</p>
