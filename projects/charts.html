<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="nav scrolled">
    <div class="nav-inner">
      <a class="nav-logo" href="../index.html"><span class="logo-mark">Tyan-an</span></a>
      <nav class="nav-menu">
        <a class="nav-link" href="../index.html#about">关于</a>
        <a class="nav-link" href="../index.html#works">作品</a>
        <a class="nav-link" href="../index.html#moment">动态</a>
        <a class="nav-link" href="../index.html#contact">联系</a>
      </nav>
    </div>
  </header>

  <section class="page-hero">
    <div class="container">
      <a class="back-link" href="../index.html#works"><i class="fa-solid fa-arrow-left"></i> 返回首页</a>
      <div class="crumb"><a href="../index.html">首页</a> / 音游《MalodyV》谱面合集</div>
      <h1>音游《MalodyV》谱面合集</h1>
      <p class="page-sub">共 11 张自制 Malody 谱面</p>
      <div class="hero-cta" style="margin-top:28px">
        <!-- TODO: 上传 zip 到 GitHub Release 后，把 href 改成该 Release 的下载链接 -->
        <a class="btn btn-primary" href="https://github.com/tyanbilibili/personal-homepage/releases" target="_blank" rel="noopener">
          <i class="fa-solid fa-download" style="margin-right:8px"></i> 下载全部谱面 (zip)
        </a>
        <a class="btn btn-ghost" href="https://malody.mugzone.net/" target="_blank" rel="noopener">了解 Malody</a>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="work-tags" style="margin-bottom:34px">
        <span>共 11 张</span>
        <span>格式 .mcz</span>
        <span>需 MalodyV 游玩</span>
      </div>

      <div class="skills-grid" id="charts"><!-- charts -->
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p class="copyright">© 2026 Tyan-an · 音游《MalodyV》谱面合集</p>
    </div>
  </footer>

  <script>
    // 谱面清单：曲名 + 文件名
    const CHARTS = [
      ["Aankhein Khuli", "Aankhein_Khuli.mcz"],
      ["Asthenopia", "Asthenopia.mcz"],
      ["CHAOSBLAST", "CHAOSBLAST.mcz"],
      ["Fast and Furious (and Desperate!)", "Fast and Furious (and Desperate_)!.mcz"],
      ["Greatness Earth", "Greatness_Earth.mcz"],
      ["The Northeast, My Hometown", "The Northeast, My Hometown.mcz"],
      ["Theme of Rabi-Ribi", "Theme of Rabi-Ribi.mcz"],
      ["Unwelcome School (MRM REMIX)", "Unwelcome_School_(MRM_REMIX).mcz"],
      ["全是国内网络热门音效的DnB + meme勾史音效的DnB + 私人笑声音效的Trance", "全是国内网络热门音效的DnB+全是meme勾史音效的DnB+全是私人笑声音效的Trance.mcz"],
      ["咲き誇る氷の花", "咲き誇る氷の花.mcz"],
      ["業火薔薇 Infernal Rose", "業火薔薇 Infernal Rose.mcz"],
    ];

    const grid = document.getElementById("charts");
    CHARTS.forEach(function (c, i) {
      const card = document.createElement("article");
      card.className = "skill-card reveal";
      card.innerHTML =
        '<div class="skill-icon"><i class="fa-solid fa-music"></i></div>' +
        '<h4>' + (i + 1) + '. ' + c[0] + '</h4>' +
        '<p style="word-break:break-all">' + c[1] + '</p>' +
        '<div class="work-tags"><span>谱面</span><span>.mcz</span></div>';
      grid.appendChild(card);
    });

    // 渐入
    if ("IntersectionObserver" in window) {
      const ob = new IntersectionObserver(function (es) {
        es.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add("in-view"); ob.unobserve(e.target); }
        });
      }, { threshold: 0.1 });
      document.querySelectorAll(".reveal").forEach(function (el) { ob.observe(el); });
    } else {
      document.querySelectorAll(".reveal").forEach(function (el) { el.classList.add("in-view"); });
    }
  </script>
</body>
</html>
